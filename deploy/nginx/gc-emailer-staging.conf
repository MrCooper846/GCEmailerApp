server {
    listen 80;
    listen [::]:80;
    server_name mailer-staging.gulfconferences.co.uk;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mailer-staging.gulfconferences.co.uk;
    ssl_certificate /etc/letsencrypt/live/mailer-staging.gulfconferences.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailer-staging.gulfconferences.co.uk/privkey.pem;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
